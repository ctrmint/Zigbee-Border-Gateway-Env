// Minimal read-only subset of SpaceX's published Local Device API schema.
// The field numbers and package/service names match device-api/device.proto.
// Copyright Space Exploration Technologies. See THIRD_PARTY_NOTICES.md.
syntax = "proto3";

package SpaceX.API.Device;

message GetDiagnosticsRequest {}

message Request {
  oneof request {
    GetStatusRequest get_status = 1004;
    GetDiagnosticsRequest get_diagnostics = 6000;
  }
}

message GetStatusRequest {}

message WifiGetDiagnosticsResponse {
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  message Network {
    string domain = 1;
    string ipv4 = 2;
    repeated string ipv6 = 3;
    uint32 clients_ethernet = 10;
    uint32 clients_2ghz = 11;
    uint32 clients_5ghz = 12;
  }
  repeated Network networks = 4;
}

message Response {
  oneof response {
    DishGetStatusResponse dish_get_status = 2004;
    WifiGetDiagnosticsResponse wifi_get_diagnostics = 6000;
  }
}

// Read-only dish status subset, based on the public Starlink terminal schema.
message DishGetStatusResponse {
  enum DishState {
    UNKNOWN = 0;
    CONNECTED = 1;
    SEARCHING = 2;
    BOOTING = 3;
  }
  optional DishState state = 1006;
  optional float snr = 1001;
  optional float pop_ping_drop_rate = 1003;
  optional float downlink_throughput_bps = 1007;
  optional float uplink_throughput_bps = 1008;
  optional float pop_ping_latency_ms = 1009;
  optional DishObstructionStats obstruction_stats = 1004;
}

message DishObstructionStats {
  optional float fraction_obstructed = 1;
  optional float valid_s = 4;
  optional bool currently_obstructed = 5;
}
